<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a href="index.html" class="logo"><span class="mark">백</span>백현 행정사사무소</a>
      <button class="menu-btn" aria-label="메뉴" aria-expanded="false"><span></span><span></span></button>
      <nav class="nav">
        <a href="work.html">업무분야</a>
        <a href="index.html#results">주요 실적</a>
        <a href="board.html" class="active">업무 일지</a>
        <a href="about.html">행정사 소개</a>
        <a href="process.html">진행절차</a>
        <a href="contact.html">오시는 길</a>
        <a href="tel:02-000-0000" class="btn btn-sm">전화 상담</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="label rise"><b>업무 일지</b>안내 · 사례 · 공지</p>
        <h1 class="rise">업무 일지</h1>
      </div>
    </section>
    <section class="wrap" style="padding-bottom:128px">
      <div class="tabs" data-tabs></div>
      <ul class="board-list" data-board></ul>
    </section>
  </main>
  <footer class="footer">
    <div class="wrap">
      <div>
        <p class="logo"><span class="mark">백</span>백현 행정사사무소</p>
        <p>대표 행정사 백재우 · 사업자등록번호 000-00-00000 · 행정사 등록번호 제0000-0000호</p>
        <p>© 2026 백현 행정사사무소</p>
      </div>
      <div><a href="admin.html">관리자</a></div>
    </div>
  </footer>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
  <script>
  (function () {
    var tabs = document.querySelector('[data-tabs]'), list = document.querySelector('[data-board]');
    var cur = '전체';
    function render() {
      var cats = ['전체'].concat(PostStore.categories);
      tabs.innerHTML = cats.map(function (c) { return '<button class="tab' + (c === cur ? ' on' : '') + '" data-c="' + c + '">' + c + '</button>'; }).join('');
      var posts = PostStore.all().filter(function (p) { return cur === '전체' || p.category === cur; });
      list.innerHTML = posts.length ? posts.map(function (p) {
        return '<li class="rise"><a href="post.html?id=' + encodeURIComponent(p.id) + '"><span class="cat">' + PostStore.esc(p.category) + (p.source === 'blog' ? ' · 블로그' : '') + '</span><h3>' + PostStore.esc(p.title) + '</h3><time>' + PostStore.fmt(p.date) + '</time></a></li>';
      }).join('') : '<li class="empty" style="margin-top:24px">이 분류에는 아직 글이 없습니다</li>';
      observeRise(list);
    }
    tabs.addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) { cur = b.dataset.c; render(); } });
    render();
  })();
  </script>
</body>
</html>
